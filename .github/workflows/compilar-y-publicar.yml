# =============================================================================
#  Compilación y publicación AUTOMÁTICA de ConfeccionesR4 POS
#
#  Cada cambio subido a la rama "main" (o el botón "Run workflow") hace, en un
#  Windows de GitHub y sin intervención:
#    1. Asigna la versión <VERSION>.<cambios desde que se editó VERSION> (1.1.0, 1.1.1…).
#    2. Compila ConfeccionesR4.exe (un solo archivo) y el instalador Inno Setup.
#    3. Firma la actualización con el secreto FIRMA_ACTUALIZACIONES.
#    4. Publica un Release con: instalador, .exe y latest.json.
#  Los POS instalados la detectan y se actualizan solos.
# =============================================================================
name: Compilar y publicar

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "ejemplos/**"]
  workflow_dispatch:
    inputs:
      notas:
        description: "Notas de la versión (qué cambió)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: compilar-y-publicar
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      URL_ACT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      PYTHONIOENCODING: utf-8
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular la versión (archivo VERSION + número de cambios)
        shell: bash
        run: |
          BASE=$(tr -d ' \r\n' < VERSION)
          DESDE=$(git log -1 --format=%H -- VERSION)
          N=$(git rev-list --count "$DESDE"..HEAD)
          while git rev-parse -q --verify "refs/tags/v$BASE.$N" >/dev/null; do N=$((N+1)); done
          echo "VERSION=$BASE.$N" >> "$GITHUB_ENV"
          echo "Versión a publicar: $BASE.$N"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Cargar la clave de firma (secreto)
        env:
          FIRMA_ACTUALIZACIONES: ${{ secrets.FIRMA_ACTUALIZACIONES }}
        run: python publicar_actualizacion.py --clave-desde-env FIRMA_ACTUALIZACIONES

      - name: Compilar .exe e instalador
        run: python build_app.py --vcredist --instalador --version ${{ env.VERSION }} --url-actualizaciones ${{ env.URL_ACT }}

      - name: Firmar la actualización
        env:
          NOTAS_VERSION: ${{ github.event.inputs.notas || github.event.head_commit.message }}
        run: python publicar_actualizacion.py --url https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/ConfeccionesR4.exe

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS_VERSION: ${{ github.event.inputs.notas || github.event.head_commit.message }}
        shell: pwsh
        run: |
          $notas = "Versión $env:VERSION`n`n$env:NOTAS_VERSION`n`nInstalación nueva: descargue Instalador_ConfeccionesR4_v1.0.exe.`nLos equipos ya instalados se actualizan solos."
          gh release create "v$env:VERSION" `
            "installer_output/Instalador_ConfeccionesR4_v1.0.exe" `
            "publicar/ConfeccionesR4.exe" `
            "publicar/latest.json" `
            --title "ConfeccionesR4 POS $env:VERSION" --notes "$notas" --latest

      - name: Borrar la clave del equipo de compilación
        if: always()
        run: if (Test-Path claves_privadas) { Remove-Item -Recurse -Force claves_privadas }
        shell: pwsh
